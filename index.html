<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>DRY EYE DEFENSE</title>
  <style>
    html,body{margin:0;height:100%;background:#111;font-family:system-ui,sans-serif;overflow:hidden;}
    body{display:flex;flex-direction:column;}
    #stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0;box-sizing:border-box;overflow:hidden;}
    #wrap{position:relative;line-height:0;}
    #game{display:block;border:4px solid #222;background:#000;touch-action:none;image-rendering:pixelated;image-rendering:crisp-edges;}
    #ui{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;image-rendering:auto;}
    #touch-controls{width:100%;display:flex;flex-direction:column;gap:4px;padding:3px 8px 5px;box-sizing:border-box;background:#0a0e1a;border-top:3px solid #1a2a1a;flex-shrink:0;}
    @media (hover:hover) and (pointer:fine){#touch-controls{display:none}}
    #util-btns{display:flex;flex-direction:row;justify-content:center;gap:12px;width:100%;}
    #util-btns button{padding:3px 16px;font-size:11px;font-weight:900;letter-spacing:.12em;border-radius:0;border:none;text-transform:uppercase;flex:1;max-width:140px;color:#a0d8ff;background:#1a2a3a;box-shadow:0 4px 0 #06111e,inset 0 1px 0 rgba(255,255,255,.12);border-top:2px solid #2a4a6a;border-left:2px solid #2a4a6a;border-right:2px solid #06111e;border-bottom:2px solid #06111e;touch-action:none;user-select:none;-webkit-user-select:none;text-shadow:0 0 8px rgba(100,180,255,.6);font-family:monospace;}
    #util-btns button:active{box-shadow:0 1px 0 #06111e,inset 0 2px 4px rgba(0,0,0,.5);transform:translateY(3px);border-top:2px solid #06111e;border-left:2px solid #06111e;border-right:2px solid #2a4a6a;border-bottom:2px solid #2a4a6a;}
    #bottom-controls{display:flex;align-items:center;justify-content:space-between;width:100%;}
    #dpad{position:relative;width:126px;height:126px;flex-shrink:0;}
    #dpad button{position:absolute;touch-action:none;user-select:none;-webkit-user-select:none;color:#58c4ff;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;border-radius:0;border:none;background:#1a2a3a;box-shadow:0 5px 0 #06111e,inset 0 1px 0 rgba(255,255,255,.10);border-top:2px solid #2a4a6a;border-left:2px solid #2a4a6a;border-right:2px solid #06111e;border-bottom:2px solid #06111e;}
    #dpad button:active{box-shadow:0 1px 0 #06111e,inset 0 3px 5px rgba(0,0,0,.5);transform:translateY(4px);border-top:2px solid #06111e;border-left:2px solid #06111e;border-right:2px solid #2a4a6a;border-bottom:2px solid #2a4a6a;}
    #dpad button[data-action="left"],#dpad button[data-action="right"]{width:42px;height:42px;top:42px;border-radius:0;}
    #dpad button[data-action="up"],#dpad button[data-action="down"]{width:42px;height:42px;left:42px;border-radius:0;}
    #dpad button[data-action="left"]{left:0;}
    #dpad button[data-action="right"]{right:0;}
    #dpad button[data-action="up"]{top:0;}
    #dpad button[data-action="down"]{bottom:0;}
    #dpad-center{position:absolute;left:42px;top:42px;width:42px;height:42px;background:#111e2e;border-radius:0;pointer-events:none;box-sizing:border-box;outline:2px solid #06111e;}
    #dpad button{box-sizing:border-box;}
    #action-btns{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:10px;flex-shrink:0;}
    #action-btns button{width:56px;height:56px;border-radius:50%;border:none;font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;text-shadow:0 1px 3px rgba(0,0,0,.9);font-family:monospace;}
    #action-btns button:active{transform:translateY(4px) scale(0.96);}
    #action-btns button[data-action="jump"]{grid-column:1/3;justify-self:center;background:radial-gradient(circle at 38% 32%,#4a8fff,#1a3faa);box-shadow:0 6px 0 #0a1e66,inset 0 1px 0 rgba(255,255,255,.2),0 0 12px rgba(60,120,255,.3);border-top:2px solid #6aaaff;border-left:2px solid #6aaaff;border-right:2px solid #0a1e66;border-bottom:2px solid #0a1e66;color:#d0eaff;}
    #action-btns button[data-action="jump"]:active{box-shadow:0 1px 0 #0a1e66,inset 0 3px 6px rgba(0,0,0,.4);}
    #action-btns button[data-action="shoot"]{background:radial-gradient(circle at 38% 32%,#ff5566,#aa1122);box-shadow:0 6px 0 #5a0010,inset 0 1px 0 rgba(255,255,255,.2),0 0 12px rgba(255,60,80,.3);border-top:2px solid #ff8899;border-left:2px solid #ff8899;border-right:2px solid #5a0010;border-bottom:2px solid #5a0010;color:#ffe0e4;}
    #action-btns button[data-action="shoot"]:active{box-shadow:0 1px 0 #5a0010,inset 0 3px 6px rgba(0,0,0,.4);}
    #action-btns button[data-action="bomb"]{background:radial-gradient(circle at 38% 32%,#22dd66,#116633);box-shadow:0 6px 0 #063318,inset 0 1px 0 rgba(255,255,255,.2),0 0 12px rgba(40,220,100,.3);border-top:2px solid #55ff99;border-left:2px solid #55ff99;border-right:2px solid #063318;border-bottom:2px solid #063318;color:#ccffe0;font-size:20px;}
    #action-btns button[data-action="bomb"].locked{background:radial-gradient(circle at 38% 32%,#2a3a2a,#1a221a);box-shadow:0 4px 0 #050f05,inset 0 1px 0 rgba(255,255,255,.05);border-top:2px solid #334433;border-left:2px solid #334433;border-right:2px solid #050f05;border-bottom:2px solid #050f05;}
    #action-btns button[data-action="bomb"]:active{box-shadow:0 1px 0 #063318,inset 0 3px 6px rgba(0,0,0,.4);}
    @media (orientation:landscape) and (hover:none) and (pointer:coarse){
  #touch-controls{
    position:fixed;inset:0;
    width:100%;height:100%;
    display:flex;flex-direction:row;align-items:flex-end;justify-content:space-between;

    background:none;border-top:none;
    pointer-events:none;
    gap:0;
  }
  #util-btns{
    position:fixed;top:6px;left:50%;transform:translateX(-50%);
    width:auto;flex-direction:row;
    pointer-events:auto;
    gap:8px;
  }
  #util-btns button{padding:3px 12px;font-size:9px;}
  #bottom-controls{
    display:contents;
  }
  #dpad{
    pointer-events:auto;
    opacity:0.82;
    width:110px;height:110px;
  }
  #dpad button[data-action="left"],#dpad button[data-action="right"]{width:37px;height:37px;top:37px;}
  #dpad button[data-action="up"],#dpad button[data-action="down"]{width:37px;height:37px;left:37px;}
  #dpad-center{left:37px;top:37px;width:37px;height:37px;}
  #action-btns{
    pointer-events:auto;
    opacity:0.82;
  }
#stage{
    position:fixed;inset:0;
    height:100vh;height:100dvh;
    flex:none;
  }
}
  </style>
</head>
<body>
  <audio id="bgMusic" src="eyemusic.mp3" loop preload="auto"></audio>
  <div id="stage">
    <div id="wrap">
      <canvas id="game" width="320" height="180"></canvas>
      <canvas id="ui" width="640" height="360" aria-hidden="true"></canvas>
    </div>
  </div>
  <div id="touch-controls">
    <div id="util-btns">
      <button data-action="shop">SHOP</button>
      <button data-action="pause">PAUSE</button>
    </div>
    <div id="bottom-controls">
      <div id="dpad">
        <button data-action="up">&#9650;</button>
        <button data-action="left">&#9664;</button>
        <button data-action="right">&#9654;</button>
        <button data-action="down">&#9660;</button>

        <button data-action="bomb" id="bombBtn">💧</button>
      </div>
    </div>
  </div>
  <script>
  (()=>{'use strict';
    const errBox=document.createElement('pre');
    errBox.style.cssText='position:fixed;left:8px;top:8px;max-width:min(92vw,900px);max-height:40vh;overflow:auto;white-space:pre-wrap;z-index:9999;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.75);color:#ffb3b3;font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;display:none;';
    document.body.appendChild(errBox);
    const showErr=m=>{errBox.textContent=String(m||'');errBox.style.display='block';};
    addEventListener('error',e=>{const loc=(e&&e.filename)?('\n'+e.filename+':'+e.lineno+':'+e.colno):'';showErr((e&&e.message?e.message:'Error')+loc);});
    addEventListener('unhandledrejection',e=>showErr('Unhandled promise rejection:\n'+(e&&e.reason?(e.reason.stack||e.reason):'Unknown')));

    const W=320,H=180;
    const cv=document.getElementById('game');
    const ctx=cv.getContext('2d');
    const uicv=document.getElementById('ui');
    const uictx=uicv.getContext('2d');
    const stage=document.getElementById('stage');
    const bgMusic=document.getElementById('bgMusic');bgMusic.volume=0.3;
    if(!cv||!ctx||!uicv||!uictx||!stage) throw new Error('Canvas init failed');

    ctx.imageSmoothingEnabled=false;
    uictx.imageSmoothingEnabled=true;
    let S=2;

    const isMobile=()=>!(window.matchMedia&&window.matchMedia('(hover:hover) and (pointer:fine)').matches);

    const uiClr=()=>{uictx.setTransform(1,0,0,1,0,0);uictx.clearRect(0,0,uicv.width,uicv.height);};
    const uiTxt=(t,x,y,px=10,col='#fff',al='left',bl='alphabetic',wgt='700')=>{
      const s=S||1;
      uictx.save();uictx.setTransform(1,0,0,1,0,0);uictx.textAlign=al;uictx.textBaseline=bl;
      uictx.font=`${wgt} ${Math.max(11,Math.round(px*s))}px system-ui,-apple-system,Segoe UI,Roboto,Arial`;
      const X=Math.round(x*s),Y=Math.round(y*s);
      uictx.lineWidth=2;uictx.strokeStyle='rgba(0,0,0,.85)';uictx.strokeText(String(t),X,Y);
      uictx.fillStyle=col;uictx.fillText(String(t),X,Y);uictx.restore();
    };
    const uiWrap=(t,x,y,maxW,px=10,col='#fff',al='left',bl='alphabetic',wgt='650',lh=12)=>{
      const s=S||1;uictx.save();uictx.setTransform(1,0,0,1,0,0);uictx.fillStyle=col;uictx.textAlign=al;uictx.textBaseline=bl;
      uictx.font=`${wgt} ${Math.max(11,Math.round(px*s))}px system-ui,-apple-system,Segoe UI,Roboto,Arial`;
      const words=String(t||'').replace(/\s+/g,' ').trim().split(' ').filter(Boolean);
      const lines=[];let cur='';
      for(const w of words){const test=cur?cur+' '+w:w;if(uictx.measureText(test).width<=maxW*s||!cur) cur=test;else{lines.push(cur);cur=w;}}
      if(cur) lines.push(cur);
      for(let i=0;i<lines.length;i++) uictx.fillText(lines[i],Math.round(x*s),Math.round((y+i*lh)*s));
      uictx.restore();return lines.length;
    };

        const HEART_BMP=[" # # #","#######","#######","#######"," ##### ","  ###  ","   #   "];
const DROP_BMP=["  #  "," ### ","#####"," ### ","  #  "];
const pxUI=(map,cols,x,y,cell=1,a=1)=>{
  const s=S||1;
  uictx.save();uictx.globalAlpha=a;
  for(let r=0;r<map.length;r++){
    const row=map[r];
    for(let c=0;c<row.length;c++){
      const k=row[c];if(k===' ') continue;
      const col=cols[k];if(!col) continue;
      uictx.fillStyle=col;
      uictx.fillRect((x+c*cell)*s,(y+r*cell)*s,cell*s,cell*s);
    }
  }
  uictx.restore();
};
const uiTextWidth=(t,px=10,wgt='700')=>{
  const s=S||1;
  uictx.save();uictx.setTransform(1,0,0,1,0,0);
  uictx.font=`${wgt} ${Math.max(11,Math.round(px*s))}px system-ui,-apple-system,Segoe UI,Roboto,Arial`;
  const w=uictx.measureText(String(t)).width;
  uictx.restore();
  return w/s;
};
const uiRowRight=(segs,rightX,y,sizePx=9,wgt='800',gap=7)=>{
  let x=rightX;
  for(let i=segs.length-1;i>=0;i--){
    const seg=segs[i];
    const w=uiTextWidth(seg.t,sizePx,wgt);
    uiTxt(seg.t,x,y,sizePx,seg.c||'#8bd9ff','right','alphabetic',wgt);
    x-=w+gap;
  }
};

    function measureAvail(){
  const panel=document.getElementById('touch-controls');
  const vis=panel&&getComputedStyle(panel).display!=='none';
  const overlay=vis&&getComputedStyle(panel).position==='fixed';
  const ph=(vis&&!overlay)?panel.getBoundingClientRect().height:0;
  const vv=window.visualViewport;
  const vw=(vv?vv.width:0)||window.innerWidth||document.documentElement.clientWidth;
  const vh=(vv?vv.height:0)||window.innerHeight||document.documentElement.clientHeight;
  return {aw:Math.max(1,vw),ah:Math.max(1,vh-ph)};
}
    function resize(){
  const panel=document.getElementById('touch-controls');
  const m=measureAvail();
  const mobile=isMobile();
  let cssW,cssH;
  if(mobile){
    const scale=Math.min(m.aw/W,m.ah/H);
    cssW=Math.round(W*scale);
    cssH=Math.round(H*scale);
    S=scale;
    showErr(`stageH:${stage.getBoundingClientRect().height} panelPos:${getComputedStyle(panel).position} panelH:${panel.getBoundingClientRect().height} | aw:${m.aw} ah:${m.ah} scale:${scale.toFixed(2)} cssW:${cssW} cssH:${cssH}`);
  }else{
    let s=Math.floor(Math.min(m.aw/W,m.ah/H));
    s=Math.max(1,Math.min(s,12));
    cssW=W*s;cssH=H*s;S=s;
  }
  cv.style.width=cssW+'px';cv.style.height=cssH+'px';
  if(cv.width!==W) cv.width=W;
  if(cv.height!==H) cv.height=H;
  const uw=Math.round(cssW),uh=Math.round(cssH);
  uicv.style.width=cssW+'px';uicv.style.height=cssH+'px';
  if(uicv.width!==uw) uicv.width=uw;
  if(uicv.height!==uh) uicv.height=uh;
  ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;
  uictx.setTransform(1,0,0,1,0,0);uictx.imageSmoothingEnabled=true;
}

    addEventListener('resize',resize,{passive:true});
    addEventListener('orientationchange',()=>{setTimeout(resize,100);},{passive:true});
    if(window.visualViewport){
  window.visualViewport.addEventListener('resize',resize,{passive:true});
}
    let roPend=false;
    const ro=new ResizeObserver(()=>{if(roPend) return;roPend=true;requestAnimationFrame(()=>{roPend=false;resize();});});
    ro.observe(stage);

    const keys=Object.create(null);
    let paused=false,st='title',tutorial=false,gt=0;
    let pauseConfirm=null; // null | 'restart' | 'quit'
    let shop=false,shopI=0,toastT=0,toastS='';
    const toast=(m,t=1)=>{toastS=String(m||'');toastT=t;};
    const down=c=>!!keys[c];
    const inp={l:()=>down('ArrowLeft')||down('KeyA'),r:()=>down('ArrowRight')||down('KeyD'),j:()=>down('Space')||down('KeyZ'),s:()=>down('KeyX')||down('KeyJ'),b:()=>down('KeyQ'),d:()=>down('ArrowDown')||down('KeyS')};

    addEventListener('keydown',e=>{
      ensureAudio();
      const c=e.code;
      if(st==='title'&&(c==='Space'||c==='Enter'||c==='KeyZ'||c==='KeyX')){start();return;}
      if(st==='tutorial'&&!e.repeat&&(c==='Enter'||c==='Space'||c==='KeyZ'||c==='KeyX')){tutPage=1;st='controls2';paused=false;shop=false;return;}
      if(st==='controls2'&&!e.repeat&&(c==='Enter'||c==='Space'||c==='KeyZ'||c==='KeyX')){tutPage=0;reset();return;}
      if(st==='controls'&&!e.repeat&&(c==='Enter'||c==='Space'||c==='KeyZ'||c==='KeyX')){tutPage=0;reset();return;}
      if(!e.repeat&&st==='playing'&&c==='KeyB'){shop=!shop;if(shop){shopI=0;}return;}
      if(shop&&st==='playing'){
        if(!e.repeat&&(c==='Escape'||c==='KeyB')){shop=false;return;}
        if(!e.repeat&&(c==='ArrowUp'||c==='KeyW'||c==='ArrowLeft'||c==='KeyA')){shopI=(shopI-1+ups.length)%ups.length;return;}
        if(!e.repeat&&(c==='ArrowDown'||c==='KeyS'||c==='ArrowRight'||c==='KeyD')){shopI=(shopI+1)%ups.length;return;}
        if(!e.repeat&&(c==='Enter'||c==='Space'||c==='KeyZ')){if(buy(ups[shopI],true)) toast('Purchased!',1);return;}
        return;
      }
      if(!e.repeat&&(c==='KeyP'||c==='Escape')){
  if(st==='playing'){
    if(!paused){paused=true;pauseConfirm=null;}
    else if(pauseConfirm){pauseConfirm=null;} // Esc backs out of confirm, doesn't resume
  }
  return;
}
      if(!e.repeat&&buyByKey(c)) toast('Purchased!',1);
      keys[c]=true;
    });
    addEventListener('keyup',e=>{keys[e.code]=false;});
    addEventListener('blur',()=>{for(const k in keys) keys[k]=false;});
    document.addEventListener('visibilitychange',()=>{if(document.hidden) for(const k in keys) keys[k]=false;});

    let actx=null;
    function ensureAudio(){ if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); } if(actx.state==='suspended') actx.resume(); }
    function playJump(){ if(!actx) return; const t=actx.currentTime; const notes=[330,392,523,659]; const step=0.035; for(let i=0;i<notes.length;i++){ const o=actx.createOscillator(); const g=actx.createGain(); o.type='square'; o.frequency.setValueAtTime(notes[i],t+i*step); g.gain.setValueAtTime(0.14,t+i*step); g.gain.setValueAtTime(0.0,t+i*step+step*0.9); o.connect(g);g.connect(actx.destination); o.start(t+i*step);o.stop(t+i*step+step); } }
    function playShoot(){ if(!actx) return; const t=actx.currentTime; const notes=[1046,784]; const step=0.02; for(let i=0;i<notes.length;i++){ const o=actx.createOscillator(); const g=actx.createGain(); o.type='square'; o.frequency.setValueAtTime(notes[i],t+i*step); g.gain.setValueAtTime(0.11,t+i*step); g.gain.setValueAtTime(0.0,t+i*step+step*0.8); o.connect(g);g.connect(actx.destination); o.start(t+i*step);o.stop(t+i*step+step); } }
    function playCollect(){ if(!actx) return; const t=actx.currentTime; const notes=[988,1319]; const step=0.055; for(let i=0;i<notes.length;i++){ const o=actx.createOscillator(); const g=actx.createGain(); o.type='square'; o.frequency.setValueAtTime(notes[i],t+i*step); g.gain.setValueAtTime(0.10,t+i*step); g.gain.setValueAtTime(0.0,t+i*step+step*0.85); o.connect(g);g.connect(actx.destination); o.start(t+i*step);o.stop(t+i*step+step); } }
    function playPop(){ if(!actx) return; const t=actx.currentTime; const o=actx.createOscillator(); const g=actx.createGain(); o.type='square'; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(40,t+0.09); g.gain.setValueAtTime(0.18,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.11); o.connect(g);g.connect(actx.destination); o.start(t);o.stop(t+0.12); const bufferSize=actx.sampleRate*0.06; const buffer=actx.createBuffer(1,bufferSize,actx.sampleRate); const data=buffer.getChannelData(0); for(let i=0;i<bufferSize;i++){data[i]=(Math.random()*2-1)*(1-i/bufferSize);} const noise=actx.createBufferSource(); noise.buffer=buffer; const ng=actx.createGain(); ng.gain.setValueAtTime(0.15,t); ng.gain.exponentialRampToValueAtTime(0.001,t+0.06); noise.connect(ng);ng.connect(actx.destination); noise.start(t); }
    function playDamage(){ if(!actx) return; const t=actx.currentTime; const thud=actx.createOscillator(); const thudGain=actx.createGain(); thud.type='sine'; thud.frequency.setValueAtTime(150,t); thud.frequency.exponentialRampToValueAtTime(45,t+0.07); thudGain.gain.setValueAtTime(0.35,t); thudGain.gain.exponentialRampToValueAtTime(0.001,t+0.12); thud.connect(thudGain);thudGain.connect(actx.destination); thud.start(t);thud.stop(t+0.13); }

    const G=700,WL=0,MS=145,JS=-250,BS=280,MAXT=100,TC=3,TPV=30,EMPTY=2200,HB=3,HC=8;
    const LAND_SPLASH_MIN_VY=140,LAND_SPLASH_COUNT_MIN=6,LAND_SPLASH_COUNT_MAX=10;
    let coinsN=0,tearC=TC,cd=0.18;
    const lvls={tearDiscount:0,fasterFire:0,healHeart:0};
    const clamp=(v,a,b)=>v<a?a:v>b?b:v;
    const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

  function drawWaveFlash(){
  if(waveFlashT<=0) return;
  const prog=1-(waveFlashT/WAVE_FLASH_DUR);
  let alpha;
  if(prog<0.15) alpha=prog/0.15;
  else if(prog<0.55) alpha=1;
  else alpha=Math.max(0,1-((prog-0.55)/0.45));
  alpha*=0.5; // softer overall — never fully opaque

  const cols=['#4a3fb0','#2e7d6b','#3a5aa8','#5a4a9e','#2a6e8a'];
  const block=48; // big chunky tiles, not fine stripes
  const cxN=Math.ceil(W/block),cyN=Math.ceil(H/block);

  // advance through only ~4 distinct color steps over the whole duration,
  // not once per frame — keeps flicker rate low
  const step=Math.floor(prog*4);

  ctx.save();
  ctx.globalAlpha=alpha;
  for(let gy=0;gy<cyN;gy++){
    for(let gx=0;gx<cxN;gx++){
      const idx=(gx+gy+step)%cols.length;
      ctx.fillStyle=cols[idx];
      ctx.fillRect(gx*block,gy*block,block,block);
    }
  }
  ctx.restore();
}

        if(ovHB(pl,v)){if(v.isBig){pl.hp=clamp(pl.hp+1,0,pl.maxH);}else{pl.tear=clamp(pl.tear+TPV,0,MAXT);}playCollect();vials.splice(i,1);}
      }
      for(let i=artTearDrops.length-1;i>=0;i--){
        const v=artTearDrops[i];
        if(!v.landed){v.vy+=G*dt;v.y+=v.vy*dt;if(land(v,24)){v.landed=true;v.vy=0;v.baseY=v.y;}}
        else{v.phase+=dt*1.8;v.y=v.baseY+Math.sin(v.phase)*2.5;}
        if(ovHB(pl,v)){pl.artT=15;pl.artCd=Math.max(pl.artCd,15);toast('ARTIFICIAL TEARS!',1.5);artTearDrops.splice(i,1);}
      }
      for(let i=coinDrops.length-1;i>=0;i--){const c=coinDrops[i];c.vy+=G*dt;c.y+=c.vy*dt;if(land(c,18)) c.vy=0;if(ovHB(pl,c)){coinsN+=(c.val|0)||1;spawnCoinSparkles(c.x+c.w*0.5,c.y+c.h*0.5,c.kind);playCollect();coinDrops.splice(i,1);}}
      for(let i=splats.length-1;i>=0;i--){const s=splats[i];s.t+=dt;if(s.t>=s.life) splats.splice(i,1);}
      for(let i=pops.length-1;i>=0;i--){
        const p=pops[i];
        if(p.splat){p.splatT+=dt;if(p.splatT>=p.splatLife) pops.splice(i,1);}
        else{p.t+=dt;p.vy+=680*dt;p.vx*=Math.pow(p.drag,dt*60);p.vy*=Math.pow(p.drag+0.04,dt*60);p.x+=p.vx*dt;p.y+=p.vy*dt;let landed=false;for(const pl2 of plats){if(p.x>=pl2.x&&p.x<=pl2.x+pl2.w&&p.y>=pl2.y&&p.y<=pl2.y+pl2.h&&p.vy>0){p.splat=true;p.splatT=0;p.splatX=p.x;p.splatY=pl2.y;landed=true;break;}}if(!landed&&p.t>=p.life) pops.splice(i,1);}
      }
      for(let i=tearSplashes.length-1;i>=0;i--){const t=tearSplashes[i];t.t+=dt;t.x+=t.vx*dt;t.y+=t.vy*dt;if(t.t>=t.life) tearSplashes.splice(i,1);}
      const BOMB_EXPLODE_R=55;
      for(let i=tearBombs.length-1;i>=0;i--){
        const b=tearBombs[i];
        if(b.exploded){
          b.explodeT+=dt;b.explodeR=Math.min(BOMB_EXPLODE_R,b.explodeR+BOMB_EXPLODE_R*dt*6);
          if(b.explodeT<0.08){
            for(let j=en.length-1;j>=0;j--){
              const e=en[j];if(e._bombHit||e._bombImmune>0) continue;
              const ecx=e.x+e.w/2,ecy=e.y+e.h/2;
              const dist=Math.hypot(ecx-b.x,ecy-b.y);
              if(dist<b.explodeR+e.w*0.5){
                e._bombHit=true;
                e.hp-=15;shake(4,0.35);
                spawnPop(ecx,ecy,e.type);
                if(e.hp<=0){kill(j,'shot');}
                else{e.slow=1;e.slowTimer=0.4;const push=ecx>b.x?1:-1;e.vx+=push*180;e.vy-=120;}
              }
            }
          }
          if(b.explodeT>0.6){tearBombs.splice(i,1);}
          continue;
        }
        b.vy+=G*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
        let hitGround=false;
        for(const p of plats){if(b.x>p.x&&b.x<p.x+p.w&&b.y+b.r>=p.y&&b.y-b.r<p.y+p.h&&b.vy>0){hitGround=true;break;}}
        if(hitGround||b.y>H){
          b.exploded=true;b.explodeT=0;b.explodeR=5;shake(5,0.4);
          for(let k=0;k<20;k++) tearSplashes.push({x:b.x,y:b.y,vx:(Math.random()*2-1)*200,vy:-(Math.random()*200+50),t:0,life:0.5});
          continue;
        }
        for(let j=0;j<en.length;j++){
          const e=en[j];const ecx=e.x+e.w/2,ecy=e.y+e.h/2;
          if(Math.hypot(ecx-b.x,ecy-b.y)<b.r+e.w*0.5){
            b.exploded=true;b.explodeT=0;b.explodeR=5;shake(5,0.4);
            for(let k=0;k<20;k++) tearSplashes.push({x:b.x,y:b.y,vx:(Math.random()*2-1)*200,vy:-(Math.random()*200+50),t:0,life:0.5});
            break;
          }
        }
      }
      for(let i=coinSparkles.length-1;i>=0;i--){const s=coinSparkles[i];s.t+=dt;s.vy+=320*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.t>=s.life) coinSparkles.splice(i,1);}
      updateDroplets(dt);
      for(let i=enemyBullets.length-1;i>=0;i--){
        const b=enemyBullets[i];
        b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
        if(b.life<=0||b.x<cx-200||b.x>cx+W+100){enemyBullets.splice(i,1);continue;}
        if(pl.inv<=0&&b.x>pl.x&&b.x<pl.x+pl.w&&b.y>pl.y&&b.y<pl.y+pl.h){
          if(pl.hasShield&&pl.shield>0){
            pl.shield--;pl.shieldRechT=0;pl.inv=0.9;pl.flash=0.2;shake(2,0.15);
          }else{
            pl.hp=Math.max(0,pl.hp-1);pl.flash=0.35;pl.inv=0.9;shake(3,0.25);playDamage();
          }
          spawnTearSplash(b.x,b.y,0);enemyBullets.splice(i,1);
        }
      }
      if(pl.onGround){pl._bobT+=dt*8;pl._bobY=Math.sin(pl._bobT)*0.7;}else{pl._bobT=0;pl._bobY=0;}
      cx=Math.max(0,Math.floor(pl.x-W*0.35));
      ensure();
      spawnBoss();
      toastT=Math.max(0,toastT-dt);
      if(pl.hp<=0){st='dead';deadT=0;paused=false;shop=false;shake(6,0.5);}
    }

    function reset(){
      st='playing';paused=false;pauseConfirm=null;shop=false;toastT=0;toastS='';
      pl.x=40;pl.y=40;pl.vx=0;pl.vy=0;pl.facing=1;pl.maxH=HB;pl.hp=HB;pl.tear=MAXT;pl.dry=0;pl.scd=0;pl.flash=0;pl.inv=0;pl.stompT=0;pl.artT=0;pl.artCd=0;pl.onGround=false;pl._bobT=0;pl._bobY=0;pl.bounceW=0;pl.hasBomb=false;pl.bombCd=0;pl.hasDoubleJump=false;pl.djUsed=false;pl.noBombCd=false;pl.hasSlam=false;pl.slamming=false;pl._jumpWas=false;pl.hasShield=false;pl.shield=0;pl.shieldRechT=0;
      coinsN=0;tearC=TC;cd=0.18;lvls.tearDiscount=0;lvls.fasterFire=0;lvls.healHeart=0;
      bullets.length=0;en.length=0;vials.length=0;splats.length=0;pops.length=0;coinDrops.length=0;tearSplashes.length=0;droplets.length=0;deadGerms.length=0;coinSparkles.length=0;artTearDrops.length=0;tearBombs.length=0;enemyBullets.length=0;
      cx=0;plats.length=0;plats.push({x:0,y:162,w:260,h:10,vy:0});
      kills=0;nextBoss=40;nextGrey=100;nextSpitter=40;spT=0;deadT=0;mini=0;greyMini=0;greyPend=false;
      spitterGateOpen=false;
      waveN=1;waveKills=0;waveGoal=40;waveBanner=1.5;waveSpawning=true;waveCompletedN=0;waveBossSpawned=false;waveBossKilled=false;waveFlashT=0;
      tearRefillCost=5;shakeT=0;shakeMag=0;ensure();
    }

    function start(){if(!tutorial){tutorial=true;st='tutorial';paused=false;shop=false;bgMusic.play().catch(()=>{});}else{reset();}}
    const toGamePt=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*(W/r.width),y:(e.clientY-r.top)*(H/r.height)};};
    const inBtn=(p,b)=>p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;

    cv.addEventListener('pointerdown',e=>{
      ensureAudio();
      const p=toGamePt(e);
      if(st==='title'){start();return;}
      if(st==='tutorial'){tutPage=1;st='controls2';paused=false;shop=false;return;}
      if(st==='controls2'){tutPage=0;reset();return;}
      if(st==='controls'){tutPage=0;reset();return;}
      if(st==='dead'){if(inBtn(p,btnRe)) reset();return;}
      if(paused&&st==='playing'&&window._pauseBtns){
  const b=window._pauseBtns;
  if(pauseConfirm){
    if(b.confirmYes&&inBtn(p,b.confirmYes)){
      if(pauseConfirm==='restart'){pauseConfirm=null;paused=false;reset();}
      else{pauseConfirm=null;paused=false;st='title';tutorial=false;titleEye=null;titleGerm=null;_drips.length=0;}
      return;
    }
    if(b.confirmNo&&inBtn(p,b.confirmNo)){pauseConfirm=null;return;}
    return;
  }
  if(b.resume&&inBtn(p,b.resume)){paused=false;return;}
  if(b.restart&&inBtn(p,b.restart)){pauseConfirm='restart';return;}
  if(b.quit&&inBtn(p,b.quit)){pauseConfirm='quit';return;}
  return;
}
    },{passive:true});
    cv.addEventListener('click',()=>{ if(bgMusic.paused) bgMusic.play().catch(()=>{}); });

    function loop(ts){if(!last) last=ts;const dt=Math.min(0.033,(ts-last)/1000);last=ts;gt+=dt;if(st==='dead') deadT+=dt;update(dt);render();requestAnimationFrame(loop);}
    resize();
    touch();
    ensure();
    const bombBtn=document.getElementById('bombBtn');
    setInterval(()=>{if(bombBtn){if(pl.hasBomb&&pl.tear>=MAXT*0.5&&pl.bombCd<=0){bombBtn.classList.remove('locked');bombBtn.style.opacity='1';}else{bombBtn.classList.add('locked');bombBtn.style.opacity=pl.hasBomb?'0.5':'0.25';}}},100);
    if(typeof spawnTearSplash!=='function') throw new Error('spawnTearSplash missing');
    requestAnimationFrame(loop);
  })();
  </script>
</body>
